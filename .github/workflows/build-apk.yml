name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: tools/replay-evaluator/run.sh
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish v0.3.14 test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.14-speech-lifecycle' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.14-debug.apk
          if gh release view v0.3.14-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.14-test burned-caption-reader-v0.3.14-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.14-test burned-caption-reader-v0.3.14-debug.apk \
              --prerelease \
              --target "$GITHUB_HEAD_REF" \
              --title "v0.3.14 test build" \
              --notes "Unmerged test APK for PR #14. Android build and automated tests passed in GitHub Actions." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Export APK for chat attachment
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.14-speech-lifecycle' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          split -b 4000000 app/build/outputs/apk/debug/app-debug.apk /tmp/caption-apk-part-
          echo "APK_TRANSFER_BEGIN"
          for part in /tmp/caption-apk-part-*; do
            sha=$(base64 -w0 "$part" |
              jq -Rs '{content: ., encoding: "base64"}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
            echo "APK_TRANSFER_PART $(basename "$part") $sha $(stat -c '%s' "$part")"
          done
          echo "APK_TRANSFER_SHA256 $(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
          echo "APK_TRANSFER_END"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: burned-caption-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
