name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: bash tools/replay-evaluator/run.sh
      - run: python3 tools/image-evaluator/test_run.py
      - name: Restore persistent signing key when configured
        env:
          CAPTION_SIGNING_KEYSTORE_BASE64: ${{ secrets.CAPTION_SIGNING_KEYSTORE_BASE64 }}
          CAPTION_REQUIRE_PERSISTENT_SIGNING: ${{ vars.CAPTION_REQUIRE_PERSISTENT_SIGNING }}
        run: python3 tools/signing/configure.py
      - name: Build and test Android
        env:
          CAPTION_REQUIRE_PERSISTENT_SIGNING: ${{ vars.CAPTION_REQUIRE_PERSISTENT_SIGNING }}
          CAPTION_KEYSTORE_PASSWORD: ${{ secrets.CAPTION_KEYSTORE_PASSWORD || 'android' }}
          CAPTION_KEY_ALIAS: ${{ secrets.CAPTION_KEY_ALIAS || 'androiddebugkey' }}
          CAPTION_KEY_PASSWORD: ${{ secrets.CAPTION_KEY_PASSWORD || 'android' }}
        run: |
          python3 tools/signing/test_configure.py
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Record APK public certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signing-info.txt
      - name: Remove private signing key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/caption-signing"
      - name: Publish v0.3.14 test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.14-speech-lifecycle' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.14-debug.apk
          if gh release view v0.3.14-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.14-test burned-caption-reader-v0.3.14-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.3.14-test burned-caption-reader-v0.3.14-debug.apk \
              --prerelease \
              --target "$GITHUB_HEAD_REF" \
              --title "v0.3.14 test build" \
              --notes "Unmerged test APK for PR #14. Android build and automated tests passed in GitHub Actions." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.15 speech boost test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.15-speech-boost' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.15-debug.apk
          sha256sum burned-caption-reader-v0.3.15-debug.apk > burned-caption-reader-v0.3.15-debug.apk.sha256
          if gh release view v0.3.15-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving the published APK and signature."
          else
            gh release create v0.3.15-test \
              burned-caption-reader-v0.3.15-debug.apk \
              burned-caption-reader-v0.3.15-debug.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.15 speech boost test build" \
              --notes "Speech-only boost: off / +6 dB / +12 dB. Automated tests passed. Device loudness is unverified. Debug signing may differ from your installed APK; preserve settings before uninstalling if an update is rejected." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.16 share-player test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.16-share-player-poc' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.16-share-player-test.apk
          sha256sum burned-caption-reader-v0.3.16-share-player-test.apk > burned-caption-reader-v0.3.16-share-player-test.apk.sha256
          if gh release view v0.3.16-share-player-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving the published test APK."
          else
            gh release create v0.3.16-share-player-test \
              burned-caption-reader-v0.3.16-share-player-test.apk \
              burned-caption-reader-v0.3.16-share-player-test.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.16 shared-player experiment" \
              --notes "Share a YouTube video from an Android browser to start an embedded player and optional OCR frame probe. Existing real-time OCR still requires one screen sharing approval per session. Device-level PixelCopy success is unverified. Debug signature may differ from previous test APKs." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.17 browser fallback test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.17-player-fallback' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.17-player-test.apk
          sha256sum burned-caption-reader-v0.3.17-player-test.apk > burned-caption-reader-v0.3.17-player-test.apk.sha256
          if gh release view v0.3.17-player-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving the published test APK."
          else
            gh release create v0.3.17-player-test \
              burned-caption-reader-v0.3.17-player-test.apk \
              burned-caption-reader-v0.3.17-player-test.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.17 browser fallback test build" \
              --notes "If YouTube rejects embedding, the video opens in the default browser and an active screen sharing session can continue caption reading. PixelCopy probe captures only an iframe snapshot, not the live OCR pipeline. Real-device verification pending. Debug signing may differ from previous builds." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.18 local reader test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.18-in-app-local-reader' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.18-local-test.apk
          sha256sum burned-caption-reader-v0.3.18-local-test.apk > burned-caption-reader-v0.3.18-local-test.apk.sha256
          if gh release view v0.3.18-local-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published APK."
          else
            gh release create v0.3.18-local-test \
              burned-caption-reader-v0.3.18-local-test.apk \
              burned-caption-reader-v0.3.18-local-test.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.18 local video OCR experiment" \
              --notes "Shared URL opens inside app without MediaProjection. PixelCopy samples the visible HTML video element and feeds local OCR/stabilization/TTS. Some video formats or protected surfaces may not expose pixels. Android real-device validation pending. Test-only debug signing may differ from older APKs." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.19 fullscreen test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.19-fullscreen-cc-filter' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.19-fullscreen-test.apk
          sha256sum burned-caption-reader-v0.3.19-fullscreen-test.apk > burned-caption-reader-v0.3.19-fullscreen-test.apk.sha256
          if gh release view v0.3.19-fullscreen-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published APK."
          else
            gh release create v0.3.19-fullscreen-test \
              burned-caption-reader-v0.3.19-fullscreen-test.apk \
              burned-caption-reader-v0.3.19-fullscreen-test.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.19 fullscreen and CC test" \
              --notes "In-app fullscreen video custom view supports local PixelCopy OCR. YouTube page CC is hidden by default, with a toggle and English-only OCR fallback filtering. YouTube HTML can change; Galaxy S25 fullscreen playback and caption suppression are not yet verified. No MediaProjection for shared URL playback." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.20 URL-first test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.20-url-home' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk burned-caption-reader-v0.3.20-url-home.apk
          sha256sum burned-caption-reader-v0.3.20-url-home.apk > burned-caption-reader-v0.3.20-url-home.apk.sha256
          if gh release view v0.3.20-url-home --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published APK."
          else
            gh release create v0.3.20-url-home \
              burned-caption-reader-v0.3.20-url-home.apk \
              burned-caption-reader-v0.3.20-url-home.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.20 URL-first app test" \
              --notes "Launcher now shows YouTube URL input and settings only. Shared URLs still open directly in the on-device video reader. Old screen capture components and projection permissions are removed from the app manifest; legacy branches are retained. Galaxy S25 UI validation pending." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.21 In-Video Caption Reader test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.21-name-volume-ui' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk in-video-caption-reader-v0.3.21.apk
          sha256sum in-video-caption-reader-v0.3.21.apk > in-video-caption-reader-v0.3.21.apk.sha256
          if gh release view v0.3.21-name-volume-ui --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published APK."
          else
            gh release create v0.3.21-name-volume-ui \
              in-video-caption-reader-v0.3.21.apk \
              in-video-caption-reader-v0.3.21.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.21 In-Video Caption Reader" \
              --notes "Renames the app, combines speech volume and boost on a 0-400% slider, and refreshes the home/settings design. Device playback and loudness require validation." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v0.3.22 player controls test APK
        if: github.event_name == 'pull_request' && github.head_ref == 'v0.3.22-player-controls' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk in-video-caption-reader-v0.3.22.apk
          sha256sum in-video-caption-reader-v0.3.22.apk > in-video-caption-reader-v0.3.22.apk.sha256
          if gh release view v0.3.22-player-controls --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published APK."
          else
            gh release create v0.3.22-player-controls \
              in-video-caption-reader-v0.3.22.apk \
              in-video-caption-reader-v0.3.22.apk.sha256 \
              --prerelease \
              --target "$CAPTION_HEAD_SHA" \
              --title "v0.3.22 player controls" \
              --notes "Speech-only pause/resume, in-player settings while video keeps playing, clearer home action, and refreshed buttons. Real-device behavior requires validation." \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish v1.0.0 stable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release already exists; preserving the published APK."
          else
            cp app/build/outputs/apk/debug/app-debug.apk in-video-caption-reader-v1.0.0.apk
            sha256sum in-video-caption-reader-v1.0.0.apk > in-video-caption-reader-v1.0.0.apk.sha256
            gh release create v1.0.0 \
              in-video-caption-reader-v1.0.0.apk \
              in-video-caption-reader-v1.0.0.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "動画内字幕リーダー v1.0.0" \
              --notes "URLを共有・入力してアプリ内でYouTubeを再生し、動画内の日本語字幕をローカルOCRとTTSで読み上げます。読み上げのみ一時停止、再生中の設定変更、専用のアプリアイコンを追加。Androidテストとビルドは成功。URL入力と共有の使い方を図解した案内ページを搭載。動画によってOCRの読み間違い・読み飛ばしがあります。APKはデバッグ署名のため以前のAPKと署名が異なる場合は上書きインストールできません。" \
              --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 2
          name: burned-caption-reader-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-info.txt
