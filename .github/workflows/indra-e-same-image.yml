name: Research same-image Indra vs E OCR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/indra-e-same-image.yml"
      - "tools/indra-ocr-research/**"

permissions:
  contents: read

jobs:
  indra-e-same-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Japanese test font and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install "indra-ocr==1.1.2" "pillow>=11,<13" "PyYAML==6.0.3"
      - name: Freeze identical synthetic test images and measure Indra
        run: |
          FONT=$(find /usr/share/fonts -type f \( -iname '*noto*CJK*regular*.ttc' -o -iname '*noto*CJK*.ttc' \) | head -1)
          test -n "$FONT"
          mkdir -p "$RUNNER_TEMP/same-image"
          python tools/indra-ocr-research/make_same_pixel_dataset.py \
            --font "$FONT" --out "$RUNNER_TEMP/same-image/dataset"
          python tools/indra-ocr-research/synthetic_japanese_smoke.py \
            --font "$FONT" --out "$RUNNER_TEMP/same-image/indra.json" \
            --repeat 3 --threads 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub Ubuntu runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download pinned PP-OCRv6 model and build app/test harness
        run: |
          python tools/models/prepare_v6.py
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Allow hardware accelerated Android emulator
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Measure the production E selector on exactly the same synthetic images
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb devices -l
            python tools/image-evaluator/run.py "$RUNNER_TEMP/same-image/dataset" "$RUNNER_TEMP/same-image/e.json" \
              --adb "$(command -v adb)" --device emulator-5554 \
              --label "indra-e-same-image-20261020" --mode player-replay \
              --ocr-mode e_mlkit_v6 --subtitle-recheck off
      - name: Same-pixel CER report and checksum gates
        run: |
          python tools/indra-ocr-research/compare_e_indra_same_pixel.py \
            --dataset "$RUNNER_TEMP/same-image/dataset" \
            --indra "$RUNNER_TEMP/same-image/indra.json" \
            --e "$RUNNER_TEMP/same-image/e.json" \
            --out "$RUNNER_TEMP/same-image/compare.json"
      - name: Upload experiment records (no private real-video frames)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indra-e-same-image-research-results
          path: |
            ${{ runner.temp }}/same-image/dataset/dataset.json
            ${{ runner.temp }}/same-image/indra.json
            ${{ runner.temp }}/same-image/e.json
            ${{ runner.temp }}/same-image/compare.json
          if-no-files-found: warn
          retention-days: 7
