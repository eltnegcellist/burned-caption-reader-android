name: YouTube sampling research checks

on:
  pull_request:
    paths:
      - ".github/workflows/youtube-sampling-research.yml"
      - "app/src/main/java/jp/hidemaru/burnedcaptionreader/SharedPlayerActivity.java"
      - "app/src/main/java/jp/hidemaru/burnedcaptionreader/MainActivity.java"
      - "app/src/main/java/jp/hidemaru/burnedcaptionreader/SubtitleSamplingExperiment.java"
      - "app/src/test/java/jp/hidemaru/burnedcaptionreader/SubtitleSamplingExperimentTest.java"
      - "tools/youtube-sampling/**"
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python numeric-only diagnostic report unit tests
        run: |
          python -m py_compile tools/youtube-sampling/summarize_diagnostics.py
          python -m unittest discover -s tools/youtube-sampling -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build pinned OCR models and run JVM tests
        run: |
          python tools/models/prepare_v6.py
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload research APK (not Galaxy tested)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-sampling-research-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
